<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/static/logout.js?v=3" defer></script>
    <script src="/static/initial-render.js?v=3"></script>
    <title>NCart | Cart</title>
    <link rel="stylesheet" href="/static/marketplace.css?v=12">
    <link rel="stylesheet" href="/static/sidebar.css?v=20">
    <link rel="stylesheet" href="/static/cart.css?v=3">
    <link rel="stylesheet" href="/static/theme.css?v=13">
    <script src="/static/sidebar.js?v=19" defer></script>
    <script src="/static/cart.js?v=1" defer></script>
  </head>
  <body class="dashboard-page cart-page">
    <main class="dashboard-shell">
      <aside class="dashboard-sidebar">
        <a class="dashboard-brand" href="/home"><img class="dashboard-brand-image" src="/static/assets/NCart_logo.png?v=4" alt="NCart"></a>
        <nav class="dashboard-nav">
          <a class="dashboard-nav-link" href="/home"><span class="dashboard-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg></span><span class="dashboard-nav-label">Home</span></a>
          <a class="dashboard-nav-link" href="/marketplace"><span class="dashboard-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 4.5 4h15l1.5 6"/><path d="M5 10v11h14V10"/><path d="M3 10a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M9 21v-6h6v6"/></svg></span><span class="dashboard-nav-label">Marketplace</span></a>
          <a class="dashboard-nav-link" href="/favorites"><span class="dashboard-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg></span><span class="dashboard-nav-label">Favorites</span></a>
          <a class="dashboard-nav-link is-active" href="/cart" hidden><span class="dashboard-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.3a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg></span><span class="dashboard-nav-label">Cart</span></a>
          <a class="dashboard-nav-link" href="/listings"><span class="dashboard-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m20.6 13.4-9.6-9.6H4v7l9.6 9.6a2 2 0 0 0 2.8 0l4.2-4.2a2 2 0 0 0 0-2.8Z"/><circle cx="7.5" cy="7.5" r="1"/></svg></span><span class="dashboard-nav-label">Posted Items</span></a>
          <a class="dashboard-nav-link" href="/messages"><span class="dashboard-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg></span><span class="dashboard-nav-label">Messages</span></a>
          <a class="dashboard-nav-link" href="/orders"><span class="dashboard-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 13H5L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></span><span class="dashboard-nav-label">My Orders</span></a>
          <a class="dashboard-nav-link" href="/reports"><span class="dashboard-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 18v-3"/><path d="M12 18v-6"/><path d="M16 18v-4"/></svg></span><span class="dashboard-nav-label">Complaints</span></a>
        </nav>
      </aside>
      <section class="dashboard-content cart-content">
        <div class="dashboard-views">
          <section class="dashboard-view is-visible">
            <div class="dashboard-view-heading">
              <div>
                <p class="dashboard-kicker">Your saved items</p>
                <h1>Shopping Cart</h1>
              </div>
            </div>
            <p class="cart-feedback" id="cart-feedback" role="status" hidden></p>
            <div class="cart-toolbar" id="cart-toolbar" hidden>
              <label><input id="cart-select-all" type="checkbox"> Select all available items</label>
              <span id="cart-item-count"></span>
            </div>
            <div class="cart-items" id="cart-items" aria-live="polite"></div>
            <section class="empty-state cart-empty" id="cart-empty" hidden>
              <span aria-hidden="true">▣</span>
              <h2>Your Cart is Empty</h2>
              <p>Items you add to your cart will appear here.</p>
              <a class="dashboard-primary" href="/marketplace">Continue Shopping</a>
            </section>
            <section class="cart-summary" id="cart-summary" hidden>
              <div><span>Selected subtotal</span><strong id="cart-subtotal">₱0.00</strong></div>
              <button class="dashboard-primary" id="cart-checkout" type="button" disabled>Checkout Selected Items</button>
            </section>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
