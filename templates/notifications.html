<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="NCart notifications">
    <script src="/static/initial-render.js?v=3"></script>
    <title>NCart | Notifications</title>
    <link rel="stylesheet" href="/static/reports.css?v=9">
    <link rel="stylesheet" href="/static/sidebar.css?v=20">
    <link rel="stylesheet" href="/static/theme.css?v=13">
    <script src="/static/sidebar.js?v=19" defer></script>
  </head>
  <body class="dashboard-page reports-page notification-page">
    <main class="dashboard-shell">
      <aside class="dashboard-sidebar" aria-label="Main navigation">
        <a class="dashboard-brand" href="/home" aria-label="NCart home">
          <img class="dashboard-brand-image" src="/static/assets/NCart_logo.png?v=4" alt="NCart">
        </a>
        <nav class="dashboard-nav">
          <a class="dashboard-nav-link" href="/home"><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg></span>Home</a>
          <a class="dashboard-nav-link" href="/marketplace"><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 4.5 4h15l1.5 6"/><path d="M5 10v11h14V10"/><path d="M3 10a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M9 21v-6h6v6"/></svg></span>Marketplace</a>
          <a class="dashboard-nav-link" href="/favorites"><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg></span>Favorites</a>
          <a class="dashboard-nav-link" href="/listings"><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m20.6 13.4-9.6-9.6H4v7l9.6 9.6a2 2 0 0 0 2.8 0l4.2-4.2a2 2 0 0 0 0-2.8Z"/><circle cx="7.5" cy="7.5" r="1"/></svg></span>My Listings</a>
          <a class="dashboard-nav-link" href="/messages"><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg></span>Messages</a>
          <a class="dashboard-nav-link" href="/orders"><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 13H5L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></span>My Orders</a>
          <a class="dashboard-nav-link" href="/reports"><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 18v-3"/><path d="M12 18v-6"/><path d="M16 18v-4"/></svg></span>Reports</a>
        </nav>
      </aside>

      <section class="dashboard-content">
        <header class="dashboard-header"></header>

        <div class="dashboard-views">
          <section class="dashboard-view is-visible">
            <div class="reports-heading">
              <div>
                <p class="reports-kicker">Updates</p>
                <h1>Notifications</h1>
              </div>
            </div>
            <div class="notification-view-controls" aria-label="Notification filters">
              <button class="notification-tab is-active" type="button" data-filter="all">All</button>
              <button class="notification-tab" type="button" data-filter="unread">Unread</button>
            </div>
            <div id="notification-list" class="notification-page-list" aria-live="polite"></div>
            <div id="notification-empty" class="reports-empty" hidden>
              <span class="reports-empty-icon" aria-hidden="true">🔔</span>
              <h2>No notifications yet</h2>
              <p>When you receive a message, purchase update, or review, it will appear here.</p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script>
      const notificationList = document.querySelector("#notification-list");
      const emptyState = document.querySelector("#notification-empty");
      const tabs = Array.from(document.querySelectorAll(".notification-tab"));
      let activeFilter = "all";

      const escapeHtml = (value) => String(value ?? "").replace(/[&<>\"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      })[character]);

      const formatTime = (value) => {
        try {
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return "Just now";
          const seconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
          if (seconds < 60) return seconds === 0 ? "Just now" : `${seconds}s ago`;
          const minutes = Math.floor(seconds / 60);
          if (minutes < 60) return `${minutes} minute${minutes === 1 ? "" : "s"} ago`;
          const hours = Math.floor(minutes / 60);
          if (hours < 24) return `${hours} hour${hours === 1 ? "" : "s"} ago`;
          const days = Math.floor(hours / 24);
          return `${days} day${days === 1 ? "" : "s"} ago`;
        } catch {
          return "Just now";
        }
      };

      const renderNotifications = (items) => {
        notificationList.innerHTML = "";
        if (!items.length) {
          emptyState.hidden = false;
          return;
        }
        emptyState.hidden = true;
        items.forEach((item) => {
          const row = document.createElement("a");
          row.href = item.link_url || "/notifications";
          row.className = `notification-item${item.is_read ? "" : " unread"}`;
          row.dataset.notificationId = String(item.id);
          row.innerHTML = `
            <span class="notification-icon" aria-hidden="true">${(item.kind || "general").startsWith("message") ? "💬" : (item.kind || "general") === "purchase" ? "🛒" : (item.kind || "general") === "rating" ? "⭐" : "🔔"}</span>
            <div class="notification-content">
              <p class="notification-title">${escapeHtml(item.title || "Notification")}</p>
              <p class="notification-message">${escapeHtml(item.message || "")}</p>
              <div class="notification-time">${formatTime(item.created_at)}</div>
            </div>
            <span class="notification-read-indicator" aria-hidden="true"></span>
          `;
          row.addEventListener("click", async (event) => {
            event.preventDefault();
            const id = row.dataset.notificationId;
            if (id) {
              try {
                await fetch("/api/notifications/mark-read", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ notification_id: Number(id) }),
                });
              } catch (error) {
                console.error(error);
              }
            }
            window.location.href = row.href;
          });
          notificationList.append(row);
        });
      };

      const loadNotifications = async () => {
        try {
          const url = activeFilter === "unread" ? "/api/notifications?unread_only=1&limit=50" : "/api/notifications?limit=50";
          const response = await fetch(url);
          if (!response.ok) throw new Error("Unable to load notifications.");
          const data = await response.json();
          renderNotifications(Array.isArray(data.notifications) ? data.notifications : []);
        } catch (error) {
          console.error(error);
          notificationList.innerHTML = "";
          emptyState.hidden = false;
        }
      };

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          activeFilter = tab.dataset.filter || "all";
          tabs.forEach((button) => button.classList.toggle("is-active", button === tab));
          void loadNotifications();
        });
      });

      void loadNotifications();
    </script>
  </body>
</html>
