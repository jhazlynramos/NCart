<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset your NCart password">
  <title>Reset your password | NCart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/reset-password.css?v=1">
</head>
<body class="login-page">
  <div class="message-modal" id="message-modal" hidden role="dialog" aria-modal="true" aria-labelledby="message-title" aria-describedby="message-text">
    <div class="message-dialog">
      <button class="message-close" id="message-close" type="button" aria-label="Close">&times;</button>
      <div class="message-icon" id="message-icon" aria-hidden="true">&times;</div>
      <h2 class="message-title" id="message-title">Error Message</h2>
      <p class="message-text" id="message-text"></p>
      <button class="message-button" id="message-button" type="button">Okay</button>
    </div>
  </div>
  <main class="login-card reset-card" aria-labelledby="reset-title">
    <a class="back-link" href="/templates/login.html">&larr; Back to welcome</a>

    <div class="login-copy" id="reset-copy">
      <p class="login-eyebrow">Account recovery</p>
      <h1 id="reset-title">Reset your password</h1>
      <p class="login-helper">Enter your email and we&rsquo;ll send reset instructions.</p>
    </div>

    <form class="login-form reset-form" id="request-form" action="/request-reset" method="post">
      <label for="reset-email">Email Address</label>
      <input id="reset-email" name="email" type="email" placeholder="you@school.edu" autocomplete="email" required>
      <button class="login-submit" type="submit">Send Reset Link</button>
    </form>

    <form class="login-form reset-form" id="change-form" action="/reset-password" method="post" hidden>
      <input id="reset-token" name="token" type="hidden">
      <label for="new-password">New Password</label>
      <input id="new-password" name="password" type="password" minlength="8" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}" title="Use at least 8 characters with an uppercase letter, lowercase letter, number, and special character." autocomplete="new-password" required>
      <ul class="password-rules" aria-live="polite">
        <li data-reset-rule="length">At least 8 characters</li>
        <li data-reset-rule="uppercase">1 uppercase letter</li>
        <li data-reset-rule="lowercase">1 lowercase letter</li>
        <li data-reset-rule="number">1 number</li>
        <li data-reset-rule="special">1 special character</li>
      </ul>
      <label for="confirm-new-password">Confirm New Password</label>
      <input id="confirm-new-password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
      <label class="show-password" for="show-reset-passwords">
        <input id="show-reset-passwords" type="checkbox">
        Show passwords
      </label>
      <button class="login-submit" type="submit">Reset Password</button>
    </form>

    <p class="login-status" id="reset-status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const status = document.querySelector('#reset-status');
    const modal = document.querySelector('#message-modal');
    const dialog = modal.querySelector('.message-dialog');
    const modalIcon = document.querySelector('#message-icon');
    const modalTitle = document.querySelector('#message-title');
    const modalText = document.querySelector('#message-text');
    const closeModal = () => {
      modal.classList.remove('is-visible');
      modal.hidden = true;
    };
    const showModal = (text, isError = true) => {
      dialog.classList.toggle('is-success', !isError);
      modalIcon.textContent = isError ? '\u00d7' : '\u2713';
      modalTitle.textContent = isError ? 'Error Message' : 'Success Message';
      modalText.textContent = text;
      modal.hidden = false;
      modal.classList.add('is-visible');
    };
    document.querySelector('#message-close').addEventListener('click', closeModal);
    document.querySelector('#message-button').addEventListener('click', closeModal);
    modal.addEventListener('click', (event) => {
      if (event.target === modal) closeModal();
    });

    const params = new URLSearchParams(window.location.search);
    const message = params.get('message');
    const error = params.get('error');
    params.delete('message');
    params.delete('error');
    history.replaceState(null, '', `${window.location.pathname}${params.toString() ? `?${params}` : ''}${window.location.hash}`);
    const token = params.get('token');
    const requestForm = document.querySelector('#request-form');
    const changeForm = document.querySelector('#change-form');
    const newPassword = document.querySelector('#new-password');
    const confirmNewPassword = document.querySelector('#confirm-new-password');
    const showResetPasswords = document.querySelector('#show-reset-passwords');
    const passwordRules = {
      length: (value) => value.length >= 8,
      uppercase: (value) => /[A-Z]/.test(value),
      lowercase: (value) => /[a-z]/.test(value),
      number: (value) => /\d/.test(value),
      special: (value) => /[^A-Za-z\d]/.test(value),
    };

    newPassword.addEventListener('input', () => {
      Object.entries(passwordRules).forEach(([rule, check]) => {
        const item = document.querySelector(`[data-reset-rule="${rule}"]`);
        item.classList.toggle('is-valid', check(newPassword.value));
      });
    });

    showResetPasswords.addEventListener('change', () => {
      const type = showResetPasswords.checked ? 'text' : 'password';
      newPassword.type = type;
      confirmNewPassword.type = type;
    });

    if (token) {
      requestForm.hidden = true;
      changeForm.hidden = false;
      document.querySelector('#reset-token').value = token;
      document.querySelector('#reset-title').textContent = 'Choose a new password';
      document.querySelector('.login-helper').textContent = 'Create a new password for your NCart account.';
    }
    if (message || error) {
      status.textContent = message || error;
      status.classList.add('is-visible');
      status.classList.toggle('is-error', Boolean(error));
      showModal(message || error, Boolean(error));
    }
  </script>
</body>
</html>
