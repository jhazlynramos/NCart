<!doctype html>
<script src="/static/logout.js?v=3" defer></script>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/static/initial-render.js?v=3"></script>
    <title>NCart | Favorites</title>
    <link rel="stylesheet" href="/static/favorites.css?v=10" />
    <link rel="stylesheet" href="/static/sidebar.css?v=20" />
    <link rel="stylesheet" href="/static/theme.css?v=13" />
    <script src="/static/sidebar.js?v=19" defer></script>
  </head>

  <script src="/static/logout.js?v=3" defer></script>

  <body class="dashboard-page">
    <main class="dashboard-shell">
      <aside class="dashboard-sidebar">
        <a class="dashboard-brand" href="/dashboard"
          ><img class="dashboard-brand-image" src="/static/assets/NCart_logo.png?v=4" alt="NCart"></a
        >
        <nav class="dashboard-nav">
          <a class="dashboard-nav-link" href="/home"><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9"/><path d="M9 21v-7h6v7"/></svg></span>Home</a
          ><a class="dashboard-nav-link" href="/marketplace"
            ><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 4.5 4h15l1.5 6"/><path d="M5 10v11h14V10"/><path d="M3 10a2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0 2 2 0 0 0 4 0"/><path d="M9 21v-6h6v6"/></svg></span>Marketplace</a
          ><a class="dashboard-nav-link is-active" href="/favorites"
            ><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg></span>Favorites</a
          ><a class="dashboard-nav-link" href="/listings"
            ><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m20.6 13.4-9.6-9.6H4v7l9.6 9.6a2 2 0 0 0 2.8 0l4.2-4.2a2 2 0 0 0 0-2.8Z"/><circle cx="7.5" cy="7.5" r="1"/></svg></span>My Listings</a
          ><a class="dashboard-nav-link" href="/messages"
            ><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg></span>Messages</a
          ><a class="dashboard-nav-link" href="/orders"
            ><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 13H5L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg></span>My Orders</a
          ><a class="dashboard-nav-link" href="/reports"
            ><span class="dashboard-nav-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 18v-3"/><path d="M12 18v-6"/><path d="M16 18v-4"/></svg></span>Reports</a
          >
        </nav>
      </aside>
      <section class="dashboard-content dashboard-inline-search-content">
        <div class="dashboard-views">
          <section class="dashboard-view is-visible">
            <div class="dashboard-view-heading has-inline-search">
              <div>
                <p class="dashboard-kicker">Saved for later</p>
                <h1>Favorites</h1>
              </div>




            </div>
            <div class="item-grid" id="favorites-grid"></div>
            <div class="empty-state" id="favorites-empty">
              <span>♥</span>
              <h2>Your favorites will appear here.</h2>
              <p>Save items from the marketplace to find them quickly later.</p>
              <a class="dashboard-primary" href="/marketplace"
                >Explore marketplace</a
              >
            </div>
          </section>
        </div>
      </section>
    </main>
    <script>
      const search = document.querySelector("#search");
      const favoritesGrid = document.querySelector("#favorites-grid");
      const favoritesEmpty = document.querySelector("#favorites-empty");
      const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
      })[character]);

      const renderFavorites = async () => {
        const response = await fetch("/api/favorites");
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Could not load favorites.");
        const query = search.value.trim().toLowerCase();
        const listings = data.listings.filter((listing) => !query || `${listing.title} ${listing.category} ${listing.item_condition} ${listing.description || ""}`.toLowerCase().includes(query));
        favoritesGrid.innerHTML = listings.map((listing) => {
          const description = String(listing.description || "").trim();
          return `
            <article class="item-card">
              ${listing.image_url ? `<div class="item-image-wrap"><img class="item-image" src="${escapeHtml(listing.image_url)}" alt="${escapeHtml(listing.title)}"><button class="favorite-button is-favorite" type="button" aria-label="Remove ${escapeHtml(listing.title)} from favorites" aria-pressed="true">♥</button></div>` : `<div class="item-image-wrap"><div class="item-image-placeholder" role="img" aria-label="No image available">No image available</div><button class="favorite-button is-favorite" type="button" aria-label="Remove ${escapeHtml(listing.title)} from favorites" aria-pressed="true">♥</button></div>`}
              <div><span class="item-category">${escapeHtml(listing.category)}</span><h3>${escapeHtml(listing.title)}</h3><p>${escapeHtml(listing.item_condition)}</p>${description ? `<small>${escapeHtml(description)}</small>` : ""}<strong>₱${escapeHtml(listing.price)}</strong><small class="listing-stock${Number(listing.quantity) === 0 ? " is-out-of-stock" : ""}">${Number(listing.quantity) > 0 ? `${Number(listing.quantity)} available` : "Out of Stock"}</small></div>
            </article>`;
        }).join("");
        favoritesGrid.querySelectorAll(".favorite-button").forEach((button, index) => {
          button.addEventListener("click", async () => {
            button.disabled = true;
            try {
              const removeResponse = await fetch(`/api/favorites/${listings[index].id}`, { method: "DELETE" });
              if (!removeResponse.ok) {
                const error = await removeResponse.json();
                throw new Error(error.error || "Could not remove favorite.");
              }
              await renderFavorites();
            } catch (error) {
              window.alert(error.message);
              button.disabled = false;
            }
          });
        });
        favoritesEmpty.hidden = data.listings.length > 0;
        favoritesGrid.hidden = data.listings.length === 0;
      };

      search.addEventListener("input", () => renderFavorites().catch((error) => window.alert(error.message)));
      renderFavorites().catch((error) => {
        favoritesEmpty.hidden = false;
        favoritesEmpty.querySelector("h2").textContent = "Favorites unavailable.";
        favoritesEmpty.querySelector("p").textContent = error.message;
      });
    </script>
  </body>
</html>
